name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to v4.5.2. Bump this tag when upgrading Quartz.
      - name: Clone Quartz
        run: git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz.git /tmp/quartz

      - name: Install Quartz dependencies
        run: cd /tmp/quartz && npm ci

      - name: Copy vault content
        run: |
          rm -rf /tmp/quartz/content/*
          for item in */; do
            case "$item" in
              Templates/|docs/) ;;
              *) cp -R "$item" /tmp/quartz/content/ ;;
            esac
          done
          for f in *.md; do
            case "$f" in
              CLAUDE.md|README.md) ;;
              *) cp -f "$f" /tmp/quartz/content/ ;;
            esac
          done
          cp .quartz/index.md /tmp/quartz/content/index.md

      - name: Apply Quartz config
        run: |
          cp .quartz/quartz.config.ts /tmp/quartz/quartz.config.ts
          cp .quartz/quartz.layout.ts /tmp/quartz/quartz.layout.ts
          cp .quartz/custom.scss /tmp/quartz/quartz/styles/custom.scss
          cp .quartz/components/ScopeFlair.tsx /tmp/quartz/quartz/components/ScopeFlair.tsx

      - name: Build
        run: cd /tmp/quartz && npx quartz build

      - name: Validate build output
        run: |
          if [ ! -f /tmp/quartz/public/index.html ]; then
            echo "::error::Build produced no index.html. Quartz build may have silently failed."
            exit 1
          fi
          PAGE_COUNT=$(find /tmp/quartz/public -name "*.html" | wc -l)
          echo "Published $PAGE_COUNT pages"
          if [ "$PAGE_COUNT" -lt 5 ]; then
            echo "::warning::Only $PAGE_COUNT pages published. Expected at least 20+. Check publish: true frontmatter."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
